# Local development stack. Do not use these credentials anywhere else.
name: sme-cyber-monitor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smecm_owner
      POSTGRES_PASSWORD: smecm_owner_dev
      POSTGRES_DB: smecm
      APP_DB_USER: smecm_app
      APP_DB_PASSWORD: smecm_app_dev
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smecm_owner -d smecm"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@postgres:5432/smecm
      MIGRATION_DATABASE_URL: postgresql+psycopg://smecm_owner:smecm_owner_dev@postgres:5432/smecm
      TEST_DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@postgres:5432/smecm_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://smecm_owner:smecm_owner_dev@postgres:5432/smecm_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      # Only these addresses may set X-Forwarded-For. In development the web container is the
      # only client; in production set this to your reverse proxy / load balancer.
      FORWARDED_ALLOW_IPS: "*"
    command: >
      sh -c "alembic upgrade head && python -m app.cli seed --demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=$${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./backend:/srv
      - ./agents:/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  monitor:
    # Runs scheduled monitoring checks. Scale with: docker compose up --scale monitor=2
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@postgres:5432/smecm
      REDIS_URL: redis://redis:6379/0
    command: python -m app.workers.monitor
    volumes:
      - ./backend:/srv
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3810:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  demo-agent:
    # Try endpoint monitoring without installing anything on your computer:
    #   SMECM_TOKEN=enr_... docker compose --profile demo up demo-agent
    image: python:3.13-slim
    profiles: ["demo"]
    hostname: demo-linux-01
    environment:
      SMECM_TOKEN: ${SMECM_TOKEN:-}
      SMECM_CONFIG: /state/agent.json
      SMECM_HEARTBEAT: "60"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./agents/endpoint:/agent:ro
      - demo-agent-state:/state
    command:
      - sh
      - -c
      - >-
        test -f /state/agent.json ||
        python /agent/smecm_agent.py enrol --server http://backend:8000
        --token "$$SMECM_TOKEN" --allow-insecure-http &&
        exec python /agent/smecm_agent.py run
    depends_on:
      backend:
        condition: service_healthy

  demo-collector:
    # Try network monitoring with a disposable collector:
    #   SMECM_COLLECTOR_TOKEN=col_... docker compose --profile demo up -d demo-collector
    image: python:3.13-slim
    profiles: ["demo"]
    hostname: demo-collector
    environment:
      SMECM_COLLECTOR_TOKEN: ${SMECM_COLLECTOR_TOKEN:-}
      SMECM_COLLECTOR_CONFIG: /state/collector.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./agents/network-collector:/collector:ro
      - demo-collector-state:/state
    command:
      - sh
      - -c
      - >-
        test -f /state/collector.json ||
        python /collector/smecm_collector.py enrol --server http://backend:8000
        --token "$$SMECM_COLLECTOR_TOKEN" --name "Demo office" --allow-insecure-http &&
        exec python /collector/smecm_collector.py run
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  demo-agent-state:
  demo-collector-state:
