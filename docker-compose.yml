# Local development stack. Do not use these credentials anywhere else.
name: sme-cyber-monitor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smecm_owner
      POSTGRES_PASSWORD: smecm_owner_dev
      POSTGRES_DB: smecm
      APP_DB_USER: smecm_app
      APP_DB_PASSWORD: smecm_app_dev
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smecm_owner -d smecm"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@postgres:5432/smecm
      MIGRATION_DATABASE_URL: postgresql+psycopg://smecm_owner:smecm_owner_dev@postgres:5432/smecm
      TEST_DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@postgres:5432/smecm_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://smecm_owner:smecm_owner_dev@postgres:5432/smecm_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      # Only these addresses may set X-Forwarded-For. In development the web container is the
      # only client; in production set this to your reverse proxy / load balancer.
      FORWARDED_ALLOW_IPS: "*"
    command: >
      sh -c "alembic upgrade head && python -m app.cli seed --demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=$${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./backend:/srv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3810:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
