name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smecm_owner
          POSTGRES_PASSWORD: smecm_owner_dev
          POSTGRES_DB: smecm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smecm_owner -d smecm"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PGPASSWORD: smecm_owner_dev
      TEST_DATABASE_URL: postgresql+psycopg://smecm_app:smecm_app_dev@localhost:5432/smecm_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://smecm_owner:smecm_owner_dev@localhost:5432/smecm_test
      TEST_REDIS_URL: redis://localhost:6379/1
      AGENT_DIST_PATH: ${{ github.workspace }}/agents/endpoint/smecm_agent.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create application role and test database
        run: |
          psql -h localhost -U smecm_owner -d smecm -c "CREATE ROLE smecm_app LOGIN PASSWORD 'smecm_app_dev' NOBYPASSRLS;" \
            -c "CREATE DATABASE smecm_test OWNER smecm_owner;"
          psql -h localhost -U smecm_owner -d smecm_test \
            -c "REVOKE ALL ON SCHEMA public FROM PUBLIC;" \
            -c "GRANT USAGE ON SCHEMA public TO smecm_app;" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE smecm_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO smecm_app;" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE smecm_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO smecm_app;"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collector unit tests (standard library only)
        run: python -m unittest discover -s agents/network-collector -t agents/network-collector
      - name: Agents compile
        run: python -m py_compile agents/endpoint/smecm_agent.py agents/network-collector/smecm_collector.py agents/wazuh/custom-smecm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed -l 100 lib test
      - run: flutter analyze
      - run: flutter test
      - name: Android release build (debug-signed in CI)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - run: flutter pub get
      - name: iOS release build (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.invalid

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependencies have no known vulnerabilities
        run: pip install pip-audit && pip-audit --require-hashes -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Web dependencies have no high or critical vulnerabilities
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Container and configuration scan (Dockerfiles, compose, dependencies)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore


  restore-drill:
    # Mandatory security scenario 10: back up, restore into a clean server, verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/restore-drill.sh
